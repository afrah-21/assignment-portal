
name: DevOps CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Automated Tests and Reporting
    runs-on: ubuntu-latest

    outputs:
      test_status: ${{ steps.result.outputs.status }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Tests
        id: tests
        continue-on-error: true
        run: |
          python -m pytest tests/test_portal.py -v \
            --json-report \
            --json-report-file=pytest-results.json

      - name: Generate JSON Report
        if: ${{ !cancelled() }}
        run: python generate_report.py

      - name: Upload JSON Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.run_id }}
          path: report-to-send.json
          if-no-files-found: error

      - name: Send Report to Local Receiver
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        continue-on-error: true
        env:
          RECEIVER_URL: ${{ secrets.RECEIVER_URL }}
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
        run: python send_report.py

      - name: Send Email Report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "DevOps CI Test Report"
          to: ${{ secrets.REPORT_EMAIL }}
          from: ${{ secrets.SMTP_USERNAME }}
          body: |
            Automated test execution completed.

            Repository: ${{ github.repository }}
            Commit: ${{ github.sha }}
            Run ID: ${{ github.run_id }}

            The detailed JSON test report is attached.
          attachments: report-to-send.json

      - name: Determine Test Status
        id: result
        if: ${{ !cancelled() }}
        run: |
          python -c "import json,os; r=json.load(open('report-to-send.json')); f=open(os.environ['GITHUB_OUTPUT'],'a'); print('status='+r['overall_status'],file=f)"

      - name: Verify Test Result
        if: ${{ !cancelled() }}
        run: |
          python -c "import json,sys; r=json.load(open('report-to-send.json')); print('Test status:',r['overall_status']); sys.exit(0 if r['overall_status']=='passed' else 1)"

  deploy:
    name: Deploy GitHub Pages
    needs: test
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      needs.test.result == 'success' &&
      needs.test.outputs.test_status == 'passed'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
